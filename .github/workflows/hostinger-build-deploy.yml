name: Build and publish MyTonWallet to Hostinger

on:
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build production site and upload to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build:production

      - name: Install password-based SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Validate root password deployment configuration
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_SERVER_DIR: ${{ secrets.HOSTINGER_SERVER_DIR }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_SSH_HOST"
          test -n "$HOSTINGER_SSH_PORT"
          test -n "$HOSTINGER_SSH_PASSWORD"
          test -n "$HOSTINGER_SERVER_DIR"

      - name: Deploy built site over one SSH stream as root
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          HOSTINGER_SERVER_DIR: ${{ secrets.HOSTINGER_SERVER_DIR }}
        run: |
          set -euo pipefail
          export SSHPASS="$HOSTINGER_SSH_PASSWORD"

          printf -v remote_dir_q '%q' "$HOSTINGER_SERVER_DIR"
          remote_command="set -e
          temp_archive=\$(mktemp)
          trap 'rm -f \"\$temp_archive\"' EXIT
          cat > \"\$temp_archive\"
          mkdir -p $remote_dir_q
          find $remote_dir_q -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf \"\$temp_archive\" -C $remote_dir_q"

          tar -C dist -czf - . | sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o PasswordAuthentication=yes \
            -o KbdInteractiveAuthentication=no \
            -p "$HOSTINGER_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "root@$HOSTINGER_SSH_HOST" \
            "$remote_command"
