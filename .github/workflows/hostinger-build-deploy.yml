name: Build and publish MyTonWallet to Hostinger

on:
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build production site and upload to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build:production

      - name: Prepare SSH private key
        env:
          HOSTINGER_SSH_PRIVATE_KEY_B64: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = ''.join(os.environ['HOSTINGER_SSH_PRIVATE_KEY_B64'].split())
          encoded += '=' * (-len(encoded) % 4)
          Path(os.environ['RUNNER_TEMP'], 'hostinger-deploy-key').write_bytes(
              base64.b64decode(encoded, validate=True),
          )
          PY
          chmod 600 "$RUNNER_TEMP/hostinger-deploy-key"
          ssh-keygen -lf "$RUNNER_TEMP/hostinger-deploy-key"

      - name: Deploy built site over one SSH stream
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SERVER_DIR: ${{ secrets.HOSTINGER_SERVER_DIR }}
        run: |
          set -euo pipefail

          printf -v remote_dir_q '%q' "$HOSTINGER_SERVER_DIR"
          remote_command="set -e
          temp_archive=\$(mktemp)
          trap 'rm -f \"\$temp_archive\"' EXIT
          cat > \"\$temp_archive\"
          mkdir -p $remote_dir_q
          find $remote_dir_q -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf \"\$temp_archive\" -C $remote_dir_q"

          tar -C dist -czf - . | ssh \
            -i "$RUNNER_TEMP/hostinger-deploy-key" \
            -p "$HOSTINGER_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "$remote_command"