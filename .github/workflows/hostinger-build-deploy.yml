name: Build and publish MyTonWallet to Hostinger

on:
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build production site and upload to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build:production

      - name: Prepare SSH private key
        env:
          HOSTINGER_SSH_PRIVATE_KEY_B64: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = ''.join(os.environ['HOSTINGER_SSH_PRIVATE_KEY_B64'].split())
          encoded += '=' * (-len(encoded) % 4)
          Path(os.environ['RUNNER_TEMP'], 'hostinger-deploy-key').write_bytes(
              base64.b64decode(encoded, validate=True),
          )
          PY
          chmod 600 "$RUNNER_TEMP/hostinger-deploy-key"
          ssh-keygen -lf "$RUNNER_TEMP/hostinger-deploy-key"

      - name: Deploy built site over SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key_path: ${{ runner.temp }}/hostinger-deploy-key
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "dist/."
          target: ${{ secrets.HOSTINGER_SERVER_DIR }}
          rm: true
          strip_components: 1
          overwrite: true