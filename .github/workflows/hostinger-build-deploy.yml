name: Build and publish MyTonWallet to Hostinger

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build production site and update Hostinger branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build:production

      - name: Publish built site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger-production
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${GITHUB_SHA} to Hostinger"