name: Build and publish MyTonWallet to Hostinger

on:
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build production site and upload to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build:production

      - name: Deploy built site over SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "dist/."
          target: ${{ secrets.HOSTINGER_SERVER_DIR }}
          rm: true
          strip_components: 1
          overwrite: true